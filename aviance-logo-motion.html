<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviance — Logo Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    cursor: none;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  }
  #grain {
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    pointer-events: none;
    z-index: 11;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    animation: grainAnim 0.5s steps(6) infinite;
  }
  @keyframes grainAnim {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-5%, -10%); }
    30% { transform: translate(3%, -15%); }
    50% { transform: translate(12%, 9%); }
    70% { transform: translate(9%, 4%); }
    90% { transform: translate(-1%, 7%); }
  }
  #tagline {
    position: fixed;
    bottom: 12%;
    width: 100%;
    text-align: center;
    z-index: 12;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0);
    transition: color 1.5s ease;
    pointer-events: none;
  }
  #tagline.visible {
    color: rgba(255,255,255,0.5);
  }
  #replay-btn {
    position: fixed;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 28px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.8s ease, background 0.3s ease;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  #replay-btn.visible {
    opacity: 1;
    pointer-events: all;
  }
  #replay-btn:hover {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="overlay"></div>
<div id="grain"></div>
<div id="tagline">Automate Your Future</div>
<button id="replay-btn" onclick="restart()">Replay</button>

<script>
// ═══════════════════════════════════════════════════
// AVIANCE — Cinematic Logo Reveal Motion Graphic
// Premium particle-assembly + deep glow + neural mesh
// ═══════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ── Color Palette ──
const COLORS = {
  primary:    [110, 140, 255],   // Electric blue
  secondary:  [180, 120, 255],   // Soft purple
  accent:     [80, 220, 255],    // Cyan
  warm:       [255, 160, 100],   // Warm amber spark
  white:      [255, 255, 255],
};

// ── Timing (frames at 60fps) ──
const PHASE = {
  VOID:          0,
  PARTICLES_IN:  60,    // 1s - particles start converging
  FORMING:       180,   // 3s - letters start forming
  GLOW_PEAK:     280,   // 4.6s - maximum glow
  NEURAL:        300,   // 5s - neural connections appear
  SETTLE:        380,   // 6.3s - everything settles
  TAGLINE:       420,   // 7s - tagline fades in
  HOLD:          540,   // 9s - hold final
};

let frame = 0;
let particles = [];
let neuralLines = [];
let textPoints = [];
let ambientParticles = [];
let logoOpacity = 0;

// ── Get text sampling points ──
function sampleTextPoints(text, fontSize, yOffset = 0) {
  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d');
  offCanvas.width = W * 2;
  offCanvas.height = H * 2;

  offCtx.fillStyle = '#fff';
  offCtx.font = `800 ${fontSize}px 'Inter', 'Segoe UI', system-ui, sans-serif`;
  offCtx.textAlign = 'center';
  offCtx.textBaseline = 'middle';
  offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2 + yOffset);

  const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
  const points = [];
  const density = Math.max(3, Math.floor(fontSize / 28));

  for (let y = 0; y < offCanvas.height; y += density) {
    for (let x = 0; x < offCanvas.width; x += density) {
      const i = (y * offCanvas.width + x) * 4;
      if (imageData.data[i + 3] > 128) {
        points.push({
          x: (x - offCanvas.width / 2) / 2 + cx,
          y: (y - offCanvas.height / 2) / 2 + cy + yOffset / 2,
        });
      }
    }
  }
  return points;
}

// ── Initialize ──
function init() {
  frame = 0;
  logoOpacity = 0;
  particles = [];
  neuralLines = [];
  ambientParticles = [];

  document.getElementById('tagline').classList.remove('visible');
  document.getElementById('replay-btn').classList.remove('visible');

  // Sample the logo text
  const fontSize = Math.min(W * 0.13, 140);
  textPoints = sampleTextPoints('AVIANCE', fontSize, 0);

  // Create particles — each one will fly to a text point
  const numParticles = Math.min(textPoints.length, 2000);
  const step = Math.max(1, Math.floor(textPoints.length / numParticles));

  for (let i = 0; i < textPoints.length; i += step) {
    const target = textPoints[i];
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * Math.max(W, H) * 0.8 + 300;
    const colorSet = [COLORS.primary, COLORS.secondary, COLORS.accent];
    const color = colorSet[Math.floor(Math.random() * colorSet.length)];

    particles.push({
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      tx: target.x,
      ty: target.y,
      ox: cx + Math.cos(angle) * dist,
      oy: cy + Math.sin(angle) * dist,
      vx: 0,
      vy: 0,
      size: Math.random() * 2.5 + 1,
      color: color,
      alpha: 0,
      delay: Math.random() * 120,
      speed: Math.random() * 0.02 + 0.015,
      settled: false,
      trail: [],
    });
  }

  // Ambient floating particles (background)
  for (let i = 0; i < 80; i++) {
    ambientParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.5 + 0.5,
      speedX: (Math.random() - 0.5) * 0.3,
      speedY: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.3 + 0.05,
      color: [COLORS.primary, COLORS.accent, COLORS.secondary][Math.floor(Math.random() * 3)],
      pulseSpeed: Math.random() * 0.02 + 0.01,
      pulseOffset: Math.random() * Math.PI * 2,
    });
  }

  // Neural network connection lines
  const neuralCount = Math.min(60, Math.floor(numParticles * 0.04));
  for (let i = 0; i < neuralCount; i++) {
    const a = Math.floor(Math.random() * particles.length);
    let b = Math.floor(Math.random() * particles.length);
    while (b === a) b = Math.floor(Math.random() * particles.length);
    const dx = particles[a].tx - particles[b].tx;
    const dy = particles[a].ty - particles[b].ty;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 120) {
      neuralLines.push({ a, b, alpha: 0 });
    }
  }
}

// ── Easing functions ──
function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

// ── Render loop ──
function render() {
  ctx.clearRect(0, 0, W, H);

  // ── Background ──
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  bgGrad.addColorStop(0, 'rgba(8, 10, 25, 1)');
  bgGrad.addColorStop(0.5, 'rgba(4, 5, 15, 1)');
  bgGrad.addColorStop(1, 'rgba(0, 0, 3, 1)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle blue nebula
  if (frame > 30) {
    const nebAlpha = Math.min(0.08, (frame - 30) / 500);
    const nebGrad = ctx.createRadialGradient(cx - W*0.15, cy - H*0.1, 0, cx, cy, W * 0.5);
    nebGrad.addColorStop(0, `rgba(60, 80, 180, ${nebAlpha})`);
    nebGrad.addColorStop(0.5, `rgba(40, 30, 120, ${nebAlpha * 0.5})`);
    nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = nebGrad;
    ctx.fillRect(0, 0, W, H);
  }

  // ── Ambient particles ──
  ambientParticles.forEach(p => {
    p.x += p.speedX;
    p.y += p.speedY;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;

    const pulse = Math.sin(frame * p.pulseSpeed + p.pulseOffset) * 0.5 + 0.5;
    const a = p.alpha * (0.5 + pulse * 0.5);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${a})`;
    ctx.fill();
  });

  // ── Main particles ──
  let settledCount = 0;

  particles.forEach((p, idx) => {
    const activeFrame = frame - PHASE.PARTICLES_IN - p.delay;

    if (activeFrame < 0) {
      // Not yet active — faint twinkle at origin
      if (frame > 20) {
        const twinkle = Math.sin(frame * 0.05 + idx) * 0.5 + 0.5;
        ctx.beginPath();
        ctx.arc(p.ox, p.oy, p.size * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${twinkle * 0.15})`;
        ctx.fill();
      }
      return;
    }

    // Converge toward target
    const progress = Math.min(1, activeFrame * p.speed);
    const ease = easeOutExpo(progress);

    p.x = p.ox + (p.tx - p.ox) * ease;
    p.y = p.oy + (p.ty - p.oy) * ease;
    p.alpha = Math.min(1, activeFrame * 0.02);

    if (progress > 0.95) {
      p.settled = true;
      settledCount++;
      // Subtle breathing at rest
      const breath = Math.sin(frame * 0.03 + idx * 0.1) * 0.8;
      p.x = p.tx + breath;
      p.y = p.ty + breath * 0.5;
    }

    // Trail
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 8) p.trail.shift();

    // Draw trail
    if (!p.settled && progress < 0.9) {
      for (let t = 0; t < p.trail.length - 1; t++) {
        const trailAlpha = (t / p.trail.length) * p.alpha * 0.3;
        ctx.beginPath();
        ctx.moveTo(p.trail[t].x, p.trail[t].y);
        ctx.lineTo(p.trail[t + 1].x, p.trail[t + 1].y);
        ctx.strokeStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${trailAlpha})`;
        ctx.lineWidth = p.size * 0.5;
        ctx.stroke();
      }
    }

    // Draw particle
    const glowSize = p.settled ? p.size * 1.2 : p.size * (1 + (1 - progress) * 2);

    // Outer glow
    const glowGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize * 4);
    glowGrad.addColorStop(0, `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${p.alpha * 0.15})`);
    glowGrad.addColorStop(1, `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, 0)`);
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowSize * 4, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${p.alpha * 0.9})`;
    ctx.fill();

    // Hot white center
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowSize * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * 0.7})`;
    ctx.fill();
  });

  // ── Neural network lines ──
  if (frame > PHASE.NEURAL) {
    const neuralProgress = Math.min(1, (frame - PHASE.NEURAL) / 80);
    neuralLines.forEach((line, i) => {
      const pa = particles[line.a];
      const pb = particles[line.b];
      if (!pa.settled || !pb.settled) return;

      const lineAlpha = easeInOutCubic(neuralProgress) * 0.12;
      const pulse = Math.sin(frame * 0.04 + i * 0.5) * 0.5 + 0.5;

      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = `rgba(${COLORS.accent[0]}, ${COLORS.accent[1]}, ${COLORS.accent[2]}, ${lineAlpha * (0.5 + pulse * 0.5)})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();

      // Traveling pulse dot
      const pulsePos = (frame * 0.008 + i * 0.3) % 1;
      const dotX = pa.x + (pb.x - pa.x) * pulsePos;
      const dotY = pa.y + (pb.y - pa.y) * pulsePos;
      ctx.beginPath();
      ctx.arc(dotX, dotY, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${COLORS.accent[0]}, ${COLORS.accent[1]}, ${COLORS.accent[2]}, ${lineAlpha * 2})`;
      ctx.fill();
    });
  }

  // ── Deep glow bloom behind text ──
  if (frame > PHASE.FORMING) {
    const glowProgress = Math.min(1, (frame - PHASE.FORMING) / 100);
    const bloomAlpha = easeInOutCubic(glowProgress) * 0.25;

    // Large soft glow
    const bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.35);
    bloom.addColorStop(0, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, ${bloomAlpha * 0.6})`);
    bloom.addColorStop(0.3, `rgba(${COLORS.secondary[0]}, ${COLORS.secondary[1]}, ${COLORS.secondary[2]}, ${bloomAlpha * 0.3})`);
    bloom.addColorStop(0.6, `rgba(${COLORS.accent[0]}, ${COLORS.accent[1]}, ${COLORS.accent[2]}, ${bloomAlpha * 0.1})`);
    bloom.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, W, H);
  }

  // ── Spark bursts at formation ──
  if (frame > PHASE.GLOW_PEAK - 20 && frame < PHASE.GLOW_PEAK + 30) {
    const sparkAlpha = 1 - Math.abs(frame - PHASE.GLOW_PEAK) / 30;
    for (let i = 0; i < 5; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 60 + 20;
      const sx = cx + Math.cos(angle) * dist;
      const sy = cy + Math.sin(angle) * dist;

      ctx.beginPath();
      ctx.arc(sx, sy, Math.random() * 2 + 1, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${COLORS.warm[0]}, ${COLORS.warm[1]}, ${COLORS.warm[2]}, ${sparkAlpha * Math.random() * 0.6})`;
      ctx.fill();
    }
  }

  // ── Solid logo text overlay (fades in as particles settle) ──
  if (frame > PHASE.FORMING + 60) {
    logoOpacity = Math.min(0.9, (frame - PHASE.FORMING - 60) / 150);
    const fontSize = Math.min(W * 0.13, 140);

    ctx.save();
    ctx.globalAlpha = logoOpacity;
    ctx.font = `800 ${fontSize}px 'Inter', 'Segoe UI', system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.letterSpacing = `${fontSize * 0.08}px`;

    // Text glow layers
    ctx.shadowColor = `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0.6)`;
    ctx.shadowBlur = 40;
    ctx.fillStyle = `rgba(220, 230, 255, ${logoOpacity})`;
    ctx.fillText('AVIANCE', cx, cy);

    // Sharper inner text
    ctx.shadowBlur = 15;
    ctx.shadowColor = `rgba(${COLORS.accent[0]}, ${COLORS.accent[1]}, ${COLORS.accent[2]}, 0.4)`;
    ctx.fillStyle = `rgba(240, 245, 255, ${logoOpacity})`;
    ctx.fillText('AVIANCE', cx, cy);

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ── Horizontal accent lines ──
  if (frame > PHASE.SETTLE) {
    const lineProgress = Math.min(1, (frame - PHASE.SETTLE) / 60);
    const lineWidth = W * 0.18 * easeOutExpo(lineProgress);
    const lineY = cy + (Math.min(W * 0.13, 140) * 0.55);
    const lineAlpha = lineProgress * 0.4;

    // Left line
    const leftGrad = ctx.createLinearGradient(cx - lineWidth - 60, lineY, cx - 60, lineY);
    leftGrad.addColorStop(0, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0)`);
    leftGrad.addColorStop(1, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, ${lineAlpha})`);
    ctx.beginPath();
    ctx.moveTo(cx - lineWidth - 60, lineY);
    ctx.lineTo(cx - 60, lineY);
    ctx.strokeStyle = leftGrad;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Right line
    const rightGrad = ctx.createLinearGradient(cx + 60, lineY, cx + lineWidth + 60, lineY);
    rightGrad.addColorStop(0, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, ${lineAlpha})`);
    rightGrad.addColorStop(1, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0)`);
    ctx.beginPath();
    ctx.moveTo(cx + 60, lineY);
    ctx.lineTo(cx + lineWidth + 60, lineY);
    ctx.strokeStyle = rightGrad;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ── Tagline ──
  if (frame > PHASE.TAGLINE) {
    document.getElementById('tagline').classList.add('visible');
  }

  // ── Replay button ──
  if (frame > PHASE.HOLD) {
    document.getElementById('replay-btn').classList.add('visible');
  }

  // ── Vignette pulse ──
  const vigPulse = Math.sin(frame * 0.008) * 0.02;
  const vig = ctx.createRadialGradient(cx, cy, W * 0.2, cx, cy, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, `rgba(0,0,0,${0.5 + vigPulse})`);
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  frame++;

  if (frame < PHASE.HOLD + 120) {
    requestAnimationFrame(render);
  } else {
    // Continue ambient loop
    ambientLoop();
  }
}

function ambientLoop() {
  ctx.clearRect(0, 0, W, H);

  // Background
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  bgGrad.addColorStop(0, 'rgba(8, 10, 25, 1)');
  bgGrad.addColorStop(0.5, 'rgba(4, 5, 15, 1)');
  bgGrad.addColorStop(1, 'rgba(0, 0, 3, 1)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Nebula
  const nebGrad = ctx.createRadialGradient(cx - W*0.15, cy - H*0.1, 0, cx, cy, W * 0.5);
  nebGrad.addColorStop(0, `rgba(60, 80, 180, 0.08)`);
  nebGrad.addColorStop(0.5, `rgba(40, 30, 120, 0.04)`);
  nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = nebGrad;
  ctx.fillRect(0, 0, W, H);

  frame++;

  // Ambient particles
  ambientParticles.forEach(p => {
    p.x += p.speedX;
    p.y += p.speedY;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    const pulse = Math.sin(frame * p.pulseSpeed + p.pulseOffset) * 0.5 + 0.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${p.alpha * (0.5 + pulse * 0.5)})`;
    ctx.fill();
  });

  // Settled particles breathing
  particles.forEach((p, idx) => {
    if (!p.settled) return;
    const breath = Math.sin(frame * 0.03 + idx * 0.1) * 0.8;
    const px = p.tx + breath;
    const py = p.ty + breath * 0.5;

    const glowGrad = ctx.createRadialGradient(px, py, 0, px, py, p.size * 3);
    glowGrad.addColorStop(0, `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, 0.12)`);
    glowGrad.addColorStop(1, `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, 0)`);
    ctx.beginPath();
    ctx.arc(px, py, p.size * 3, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(px, py, p.size * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, 0.7)`;
    ctx.fill();
  });

  // Neural lines
  neuralLines.forEach((line, i) => {
    const pa = particles[line.a];
    const pb = particles[line.b];
    if (!pa.settled || !pb.settled) return;
    const pulse = Math.sin(frame * 0.04 + i * 0.5) * 0.5 + 0.5;
    ctx.beginPath();
    ctx.moveTo(pa.tx, pa.ty);
    ctx.lineTo(pb.tx, pb.ty);
    ctx.strokeStyle = `rgba(${COLORS.accent[0]}, ${COLORS.accent[1]}, ${COLORS.accent[2]}, ${0.06 * (0.5 + pulse * 0.5)})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();

    const pulsePos = (frame * 0.008 + i * 0.3) % 1;
    const dotX = pa.tx + (pb.tx - pa.tx) * pulsePos;
    const dotY = pa.ty + (pb.ty - pa.ty) * pulsePos;
    ctx.beginPath();
    ctx.arc(dotX, dotY, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${COLORS.accent[0]}, ${COLORS.accent[1]}, ${COLORS.accent[2]}, 0.15)`;
    ctx.fill();
  });

  // Bloom
  const bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.35);
  bloom.addColorStop(0, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0.12)`);
  bloom.addColorStop(0.3, `rgba(${COLORS.secondary[0]}, ${COLORS.secondary[1]}, ${COLORS.secondary[2]}, 0.06)`);
  bloom.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, W, H);

  // Logo text
  const fontSize = Math.min(W * 0.13, 140);
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.font = `800 ${fontSize}px 'Inter', 'Segoe UI', system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0.5)`;
  ctx.shadowBlur = 30 + Math.sin(frame * 0.015) * 10;
  ctx.fillStyle = `rgba(230, 235, 255, 0.9)`;
  ctx.fillText('AVIANCE', cx, cy);
  ctx.shadowBlur = 12;
  ctx.shadowColor = `rgba(${COLORS.accent[0]}, ${COLORS.accent[1]}, ${COLORS.accent[2]}, 0.3)`;
  ctx.fillStyle = `rgba(240, 245, 255, 0.9)`;
  ctx.fillText('AVIANCE', cx, cy);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Accent lines
  const lineY = cy + (fontSize * 0.55);
  const leftGrad = ctx.createLinearGradient(cx - W*0.18 - 60, lineY, cx - 60, lineY);
  leftGrad.addColorStop(0, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0)`);
  leftGrad.addColorStop(1, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0.4)`);
  ctx.beginPath();
  ctx.moveTo(cx - W*0.18 - 60, lineY);
  ctx.lineTo(cx - 60, lineY);
  ctx.strokeStyle = leftGrad;
  ctx.lineWidth = 1;
  ctx.stroke();

  const rightGrad = ctx.createLinearGradient(cx + 60, lineY, cx + W*0.18 + 60, lineY);
  rightGrad.addColorStop(0, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0.4)`);
  rightGrad.addColorStop(1, `rgba(${COLORS.primary[0]}, ${COLORS.primary[1]}, ${COLORS.primary[2]}, 0)`);
  ctx.beginPath();
  ctx.moveTo(cx + 60, lineY);
  ctx.lineTo(cx + W*0.18 + 60, lineY);
  ctx.strokeStyle = rightGrad;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Vignette
  const vig = ctx.createRadialGradient(cx, cy, W * 0.2, cx, cy, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, `rgba(0,0,0,${0.5 + Math.sin(frame * 0.008) * 0.02})`);
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(ambientLoop);
}

function restart() {
  init();
  render();
}

// ── Start ──
init();
render();
</script>
</body>
</html>
