<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviance — Figma-Traced Particle Logo Reveal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Segoe UI',system-ui,sans-serif}
canvas#main{display:block;position:absolute;top:0;left:0;z-index:1}
canvas#src{display:none}

#grain{position:fixed;top:-50%;left:-50%;width:200%;height:200%;pointer-events:none;z-index:20;opacity:0.025;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
animation:grain .4s steps(5) infinite}
@keyframes grain{0%,100%{transform:translate(0,0)}20%{transform:translate(-5%,-10%)}40%{transform:translate(3%,-15%)}60%{transform:translate(12%,9%)}80%{transform:translate(-1%,7%)}}

#vignette{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:19;
background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.75) 100%)}

#brandName{position:fixed;bottom:15%;width:100%;text-align:center;z-index:15;opacity:0;
font-size:clamp(22px,3.8vw,46px);font-weight:200;letter-spacing:.65em;text-transform:uppercase;
color:rgba(255,255,255,0.85);transition:opacity 2s ease}
#brandName.visible{opacity:1}

#tagline{position:fixed;bottom:9%;width:100%;text-align:center;z-index:15;opacity:0;
font-size:clamp(11px,1.5vw,17px);font-weight:300;letter-spacing:.45em;text-transform:uppercase;
color:rgba(255,255,255,0.5);transition:opacity 2.2s ease}
#tagline.visible{opacity:1}

#replay{position:fixed;bottom:3%;right:4%;z-index:25;opacity:0;pointer-events:none;
background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
color:rgba(255,255,255,.4);padding:8px 22px;border-radius:30px;
font-size:11px;letter-spacing:.25em;text-transform:uppercase;
cursor:pointer;transition:all .4s ease;font-family:inherit}
#replay.visible{opacity:1;pointer-events:auto}
#replay:hover{background:rgba(138,92,246,.15);border-color:rgba(138,92,246,.4);color:#fff}

#phaseLabel{position:fixed;top:4%;left:50%;transform:translateX(-50%);z-index:15;opacity:0;
font-size:9px;letter-spacing:.5em;text-transform:uppercase;
color:rgba(138,92,246,.3);transition:opacity .5s ease}
#phaseLabel.visible{opacity:1}
</style>
</head>
<body>
<canvas id="src" width="800" height="800"></canvas>
<canvas id="main"></canvas>
<div id="grain"></div>
<div id="vignette"></div>
<div id="phaseLabel"></div>
<div id="brandName">Aviance</div>
<div id="tagline">Intelligent Automation · Elevated</div>
<button id="replay">↻ Replay</button>

<script>
// ═══════════════════════════════════════════════════════════
//  AVIANCE — FIGMA-TRACED PARTICLE LOGO REVEAL v3
//  Uses exact vector coordinates extracted from Figma file
//  File: C63419rfF1FTeJB8yzNe1P (Aviance Logo — Motion Graphic Source)
//
//  Figma node data:
//    Frame:        800×800
//    Gradient Ring: ellipse at (120,120) 560×560, stroke 6px
//    Left Stroke:   vector at (290,200) 90×270, stroke 28px
//    Right Stroke:  vector at (390,200) 100×270, stroke 24px
//    Alpha Loop:    vector at (335,330) ~112×102, stroke 22px
//    Ring Dot:      ellipse at (520,155) 28×28
// ═══════════════════════════════════════════════════════════

const mainCanvas = document.getElementById('main');
const ctx = mainCanvas.getContext('2d');
const srcCanvas = document.getElementById('src');
const srcCtx = srcCanvas.getContext('2d');

let W, H, cx, cy, sc;
let startTime, raf;
let logoParts = [], ringParts = [], ambients = [], sparks = [];

// ─── PALETTE ───
const C = {
  purple:     [138, 92, 246],
  blue:       [99, 130, 255],
  deepPurple: [88, 52, 196],
  white:      [255, 255, 255],
  cyan:       [140, 210, 255],
  lavender:   [170, 140, 255],
};

// ─── TIMING ───
const PH = { drift:1.8, converge:4.0, snap:2.2, ring:1.8, bloom:0.8, glitch:0.5, hold:5.0 };
const TOTAL = Object.values(PH).reduce((a,b)=>a+b,0);

// ═══════════════════════════════════════
//  FIGMA VECTOR RENDERING (hidden canvas)
//  Exact coordinates from Figma file
// ═══════════════════════════════════════

function cubicBezier(ctx, x0,y0, cx1,cy1, cx2,cy2, x1,y1) {
  ctx.moveTo(x0, y0);
  ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x1, y1);
}

function renderFigmaLogo() {
  const S = 800;
  srcCtx.clearRect(0, 0, S, S);
  srcCtx.strokeStyle = '#fff';
  srcCtx.fillStyle = '#fff';
  srcCtx.lineCap = 'round';
  srcCtx.lineJoin = 'round';

  // ── LEFT STROKE ──
  // Figma: at (290,200), vertices [(0,270),(90,0)], tangents [(15,-100),(-10,50)]
  // Absolute: (290,470) → (380,200)
  srcCtx.lineWidth = 28;
  srcCtx.beginPath();
  cubicBezier(srcCtx,
    290, 470,                   // start
    290+15, 470-100,            // control 1 (start + tangentStart)
    380-10, 200+50,             // control 2 (end + tangentEnd)
    380, 200                    // end
  );
  srcCtx.stroke();

  // ── RIGHT STROKE ──
  // Figma: at (390,200), vertices [(0,0),(100,270)], tangents [(10,50),(-15,-100)]
  // Absolute: (390,200) → (490,470)
  srcCtx.lineWidth = 24;
  srcCtx.beginPath();
  cubicBezier(srcCtx,
    390, 200,                   // start
    390+10, 200+50,             // control 1
    490-15, 470-100,            // control 2
    490, 470                    // end
  );
  srcCtx.stroke();

  // ── ALPHA LOOP ──
  // Figma: at (335,330), 7 vertices forming the loop
  // Vertices (absolute):
  //   v0: (335,380), v1: (365,330), v2: (415,330)
  //   v3: (445,375), v4: (415,425), v5: (360,415), v6: (335,380)
  // With bezier tangents for each segment
  const lx = 335, ly = 330;
  const verts = [
    { x: lx+0,   y: ly+50  },  // v0 (335, 380)
    { x: lx+30,  y: ly+0   },  // v1 (365, 330)
    { x: lx+80,  y: ly+0   },  // v2 (415, 330)
    { x: lx+110, y: ly+45  },  // v3 (445, 375)
    { x: lx+80,  y: ly+95  },  // v4 (415, 425)
    { x: lx+25,  y: ly+85  },  // v5 (360, 415)
    { x: lx+0,   y: ly+50  },  // v6 = v0 (335, 380)
  ];
  // Tangent pairs from Figma vectorNetwork
  const segs = [
    { ts:{x:-5,y:-25}, te:{x:-15,y:15} },   // v0→v1
    { ts:{x:20,y:-5},  te:{x:-20,y:-5} },   // v1→v2
    { ts:{x:20,y:5},   te:{x:5,y:-25} },    // v2→v3
    { ts:{x:-5,y:25},  te:{x:15,y:-10} },   // v3→v4
    { ts:{x:-20,y:10}, te:{x:20,y:5} },     // v4→v5
    { ts:{x:-15,y:-5}, te:{x:5,y:20} },     // v5→v6
  ];

  srcCtx.lineWidth = 22;
  for (let i = 0; i < segs.length; i++) {
    const v0 = verts[i], v1 = verts[i+1], s = segs[i];
    srcCtx.beginPath();
    cubicBezier(srcCtx,
      v0.x, v0.y,
      v0.x + s.ts.x, v0.y + s.ts.y,
      v1.x + s.te.x, v1.y + s.te.y,
      v1.x, v1.y
    );
    srcCtx.stroke();
  }

  // ── RING DOT ──
  // Figma: at (520,155) 28×28 → center (534, 169), radius 14
  srcCtx.beginPath();
  srcCtx.arc(534, 169, 14, 0, Math.PI * 2);
  srcCtx.fill();
}

function samplePixels(count) {
  const S = 800;
  const data = srcCtx.getImageData(0, 0, S, S).data;
  const hits = [];

  for (let y = 0; y < S; y += 2) {
    for (let x = 0; x < S; x += 2) {
      const i = (y * S + x) * 4;
      if (data[i] > 160 && data[i+1] > 160 && data[i+2] > 160 && data[i+3] > 80) {
        hits.push({ x: x - S/2, y: y - S/2 });
      }
    }
  }

  const pts = [];
  for (let i = 0; i < count; i++) {
    if (hits.length === 0) break;
    const p = hits[Math.floor(Math.random() * hits.length)];
    pts.push({
      x: p.x + (Math.random() - 0.5) * 2.5,
      y: p.y + (Math.random() - 0.5) * 2.5,
    });
  }
  return pts;
}

function getRingPts(count) {
  // Figma ring: ellipse at (120,120) 560×560 → center (400,400), radius 280
  const pts = [];
  const r = 280;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.01;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, angle: a });
  }
  return pts;
}

// ─── EASING ───
const ease = {
  outExpo: t => t===1?1:1-Math.pow(2,-10*t),
  outBack: t => {const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  outQuart: t => 1-Math.pow(1-t,4),
};

// ─── PARTICLE ───
class Particle {
  constructor(tx,ty,type) {
    this.type = type;
    this.tx = tx; this.ty = ty;
    const a = Math.random()*6.28;
    const d = (300+Math.random()*550)*sc;
    this.x = cx+Math.cos(a)*d;
    this.y = cy+Math.sin(a)*d;
    this.vx = (Math.random()-.5)*2;
    this.vy = (Math.random()-.5)*2;
    this.size = type==='logo'
      ? (1.0+Math.random()*2.0)*sc
      : (0.6+Math.random()*1.2)*sc;
    const r = Math.random();
    if (type==='logo') {
      this.color = r<.35?C.white:r<.55?C.lavender:r<.72?C.purple:r<.88?C.blue:C.cyan;
    } else {
      this.color = r<.4?C.purple:r<.7?C.blue:r<.85?C.deepPurple:C.cyan;
    }
    this.alpha = 0;
    this.maxA = .4+Math.random()*.6;
    this.delay = Math.random()*.75;
    this.pOff = Math.random()*6.28;
    this.pSpd = .5+Math.random()*1.5;
  }
  tgt(){return{x:this.tx*sc+cx, y:this.ty*sc+cy}}
  update(el,dt){
    const g=this.tgt();
    const{drift,converge,snap}=PH;
    const t1=drift,t2=t1+converge,t3=t2+snap;
    if(el<t1+this.delay){
      this.x+=this.vx*dt*48;this.y+=this.vy*dt*48;
      this.vx+=(Math.random()-.5)*.07;this.vy+=(Math.random()-.5)*.07;
      this.vx*=.987;this.vy*=.987;
      this.alpha=Math.min(this.alpha+dt*1.2,this.maxA*.2);
    }else if(el<t2){
      const p=ease.outExpo(Math.min(1,(el-t1-this.delay)/Math.max(.1,converge-this.delay)));
      this.x+=(g.x-this.x)*p*.055;
      this.y+=(g.y-this.y)*p*.055;
      this.vx*=.91;this.vy*=.91;
      this.alpha=Math.min(this.alpha+dt*2.2,this.maxA*.5);
    }else if(el<t3){
      this.x+=(g.x-this.x)*.13;
      this.y+=(g.y-this.y)*.13;
      const p=ease.outBack(Math.min(1,(el-t2)/snap));
      this.alpha=this.maxA*(.5+.5*p);
    }else{
      this.x+=(g.x-this.x)*.16;
      this.y+=(g.y-this.y)*.16;
      const breath=Math.sin(el*this.pSpd+this.pOff)*.1;
      this.alpha=this.maxA*(.9+breath);
    }
  }
  draw(ctx,gx){
    if(this.alpha<.01)return;
    const ox=gx?(Math.random()>.5?gx:-gx):0;
    ctx.beginPath();
    ctx.arc(this.x+ox,this.y,this.size,0,6.28);
    ctx.fillStyle=`rgba(${this.color[0]},${this.color[1]},${this.color[2]},${this.alpha})`;
    ctx.fill();
    if(this.alpha>.3){
      ctx.beginPath();
      ctx.arc(this.x+ox,this.y,this.size*3.5,0,6.28);
      ctx.fillStyle=`rgba(${this.color[0]},${this.color[1]},${this.color[2]},${this.alpha*.05})`;
      ctx.fill();
    }
  }
}

class Ambient {
  constructor(){this.reset()}
  reset(){
    this.x=Math.random()*W;this.y=Math.random()*H;
    this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;
    this.size=(.3+Math.random()*1.1)*sc;
    this.alpha=.03+Math.random()*.1;
    const r=Math.random();
    this.color=r<.4?C.purple:r<.7?C.blue:C.cyan;
  }
  update(dt){
    this.x+=this.vx*dt*50;this.y+=this.vy*dt*50;
    if(this.x<-20||this.x>W+20||this.y<-20||this.y>H+20)this.reset();
  }
  draw(ctx){
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,6.28);
    ctx.fillStyle=`rgba(${this.color[0]},${this.color[1]},${this.color[2]},${this.alpha})`;
    ctx.fill();
  }
}

class Spark {
  constructor(){this.on=false}
  emit(x,y){
    this.x=x;this.y=y;
    const a=Math.random()*6.28;const s=(2+Math.random()*5)*sc;
    this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
    this.life=this.ml=.35+Math.random()*.65;
    this.size=(.3+Math.random()*1.1)*sc;
    this.color=Math.random()>.5?C.purple:C.cyan;
    this.on=true;
  }
  update(dt){
    if(!this.on)return;
    this.x+=this.vx*dt*50;this.y+=this.vy*dt*50;
    this.vx*=.95;this.vy*=.95;this.life-=dt;
    if(this.life<=0)this.on=false;
  }
  draw(ctx){
    if(!this.on)return;const a=this.life/this.ml;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size*a,0,6.28);
    ctx.fillStyle=`rgba(${this.color[0]},${this.color[1]},${this.color[2]},${a*.6})`;
    ctx.fill();
  }
}

// ─── RESIZE ───
function resize(){
  W=mainCanvas.width=innerWidth;
  H=mainCanvas.height=innerHeight;
  cx=W/2;cy=H/2;
  sc=Math.min(W,H)/900;
}

// ─── INIT ───
function init(){
  resize();
  logoParts=[];ringParts=[];ambients=[];sparks=[];
  document.getElementById('tagline').classList.remove('visible');
  document.getElementById('brandName').classList.remove('visible');
  document.getElementById('replay').classList.remove('visible');
  document.getElementById('phaseLabel').classList.remove('visible');

  // Render Figma vectors on hidden canvas → sample pixels
  renderFigmaLogo();
  const pts = samplePixels(3500);
  for(const p of pts) logoParts.push(new Particle(p.x,p.y,'logo'));

  // Ring particles (from Figma ellipse data)
  const rpts = getRingPts(750);
  for(const p of rpts){const rp=new Particle(p.x,p.y,'ring');rp.delay+=.6;ringParts.push(rp)}

  for(let i=0;i<150;i++)ambients.push(new Ambient());
  for(let i=0;i<90;i++)sparks.push(new Spark());

  startTime=performance.now();
  glitchT=0;sparkT=0;lastT=0;
  if(raf)cancelAnimationFrame(raf);
  loop();
}

// ─── RENDER LOOP ───
let lastT=0,sparkT=0,glitchT=0;

function loop(){
  const now=performance.now();
  const dt=Math.min((now-(lastT||now))/1000,.05);
  lastT=now;
  const el=(now-startTime)/1000;

  const{drift,converge,snap,ring,bloom,glitch}=PH;
  const t1=drift,t2=t1+converge,t3=t2+snap,t4=t3+ring,t5=t4+bloom,t6=t5+glitch;

  let phase='drift';
  if(el>t6)phase='hold';
  else if(el>t5)phase='glitch';
  else if(el>t4)phase='bloom';
  else if(el>t3)phase='ring';
  else if(el>t2)phase='snap';
  else if(el>t1)phase='converge';

  // Phase label
  const pl=document.getElementById('phaseLabel');
  const labels={drift:'Initializing',converge:'Assembling',snap:'Forming',ring:'Activating',bloom:'Powering Up',glitch:'Online',hold:'Aviance'};
  pl.textContent=labels[phase]||'';
  pl.classList.add('visible');

  // Glitch offset
  let gx=0;
  if(phase==='glitch'){
    glitchT+=dt;
    if(glitchT<glitch)gx=Math.random()<.3?Math.sin(glitchT*50)*6*sc:0;
  }

  // Trail clear
  ctx.fillStyle=el<.1?'#000':'rgba(0,0,0,0.13)';
  ctx.fillRect(0,0,W,H);

  // Ambient
  for(const a of ambients){a.update(dt);a.draw(ctx)}

  // Logo particles
  for(const p of logoParts){p.update(el,dt);p.draw(ctx,gx)}

  // Ring particles (delayed entry)
  if(el>t1+converge*.6){
    for(const r of ringParts){r.update(el-.6,dt);r.draw(ctx,gx*.35)}
  }

  // Figma gradient ring stroke overlay
  if(el>t3){
    const ra=Math.min(1,(el-t3)/ring);
    const radius=280*sc;
    ctx.save();
    ctx.translate(cx,cy);

    // Main purple ring
    ctx.beginPath();ctx.arc(0,0,radius,0,6.28);
    ctx.strokeStyle=`rgba(138,92,246,${ra*.35})`;
    ctx.lineWidth=3*sc;
    ctx.shadowColor='rgba(138,92,246,0.5)';
    ctx.shadowBlur=20*sc;
    ctx.stroke();

    // Blue overlay
    ctx.beginPath();ctx.arc(0,0,radius,0,6.28);
    ctx.strokeStyle=`rgba(99,130,255,${ra*.2})`;
    ctx.lineWidth=1.8*sc;
    ctx.shadowColor='rgba(99,130,255,0.35)';
    ctx.shadowBlur=25*sc;
    ctx.stroke();

    // Gradient arc (purple → blue, matching Figma gradient)
    const grd=ctx.createLinearGradient(-radius,-radius,radius,radius);
    grd.addColorStop(0,`rgba(138,92,246,${ra*.4})`);
    grd.addColorStop(.5,`rgba(107,115,245,${ra*.35})`);
    grd.addColorStop(1,`rgba(99,130,255,${ra*.4})`);
    ctx.beginPath();ctx.arc(0,0,radius,0,6.28);
    ctx.strokeStyle=grd;
    ctx.lineWidth=3.5*sc;
    ctx.shadowBlur=0;
    ctx.stroke();

    ctx.restore();
  }

  // Sparks during snap & ring
  if(phase==='snap'||phase==='ring'){
    sparkT+=dt;
    if(sparkT>.03){
      sparkT=0;
      const s=sparks.find(s=>!s.on);
      if(s){const src=logoParts[Math.floor(Math.random()*logoParts.length)];s.emit(src.x,src.y)}
    }
  }
  for(const s of sparks){s.update(dt);s.draw(ctx)}

  // Center bloom
  if(el>t2){
    const bp=Math.min(1,(el-t2)/(snap+ring));
    const ba=bp*.09;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,240*sc);
    g.addColorStop(0,`rgba(138,92,246,${ba})`);
    g.addColorStop(.35,`rgba(99,130,255,${ba*.3})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
  }

  // Glitch flash + scan lines + chromatic strips
  if(phase==='glitch'&&glitchT<.15){
    const gi=1-glitchT/.15;
    ctx.fillStyle=`rgba(138,92,246,${.05*gi})`;
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<H;i+=3){
      if(Math.random()<.2){
        ctx.fillStyle=`rgba(0,0,0,${.07*Math.random()})`;
        ctx.fillRect(0,i,W,1.5);
      }
    }
    if(Math.random()<.5){
      const sy=Math.random()*H,sh=2+Math.random()*10;
      ctx.fillStyle=`rgba(138,92,246,.03)`;
      ctx.fillRect(0,sy,W,sh);
      ctx.fillStyle=`rgba(99,130,255,.02)`;
      ctx.fillRect(3*sc,sy+sh,W,sh*.6);
    }
  }

  // Brand name + tagline
  if(el>t4+bloom*.3)document.getElementById('brandName').classList.add('visible');
  if(el>t5)document.getElementById('tagline').classList.add('visible');
  if(el>TOTAL-PH.hold+2.5){
    document.getElementById('replay').classList.add('visible');
    pl.textContent='Aviance';
  }

  // Slow ring rotation when settled
  if(el>t3+ring){
    for(const r of ringParts){
      const tg=r.tgt();
      const dx=tg.x-cx,dy=tg.y-cy;
      const ang=Math.atan2(dy,dx)+.00035;
      const dist=Math.sqrt(dx*dx+dy*dy)/sc;
      r.tx=Math.cos(ang)*dist;
      r.ty=Math.sin(ang)*dist;
    }
  }

  raf=requestAnimationFrame(loop);
}

// ─── EVENTS ───
window.addEventListener('resize',resize);
document.getElementById('replay').addEventListener('click',init);

// ─── GO ───
init();
</script>
</body>
</html>
