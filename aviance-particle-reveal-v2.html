<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviance — Cinematic Particle Logo Reveal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Segoe UI',system-ui,sans-serif}
canvas#main{display:block;position:absolute;top:0;left:0;z-index:1}
canvas#logoSrc{display:none}

#grain{position:fixed;top:-50%;left:-50%;width:200%;height:200%;pointer-events:none;z-index:20;opacity:0.03;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
animation:grain .4s steps(5) infinite}
@keyframes grain{0%,100%{transform:translate(0,0)}20%{transform:translate(-5%,-10%)}40%{transform:translate(3%,-15%)}60%{transform:translate(12%,9%)}80%{transform:translate(-1%,7%)}}

#vignette{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:19;
background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.75) 100%)}

#tagline{position:fixed;bottom:9%;width:100%;text-align:center;z-index:15;opacity:0;
font-size:clamp(13px,1.8vw,20px);font-weight:300;letter-spacing:.4em;text-transform:uppercase;
color:rgba(255,255,255,0.6);transition:opacity 2s ease}
#tagline.visible{opacity:1}

#brandName{position:fixed;bottom:14%;width:100%;text-align:center;z-index:15;opacity:0;
font-size:clamp(20px,3.5vw,42px);font-weight:200;letter-spacing:.6em;text-transform:uppercase;
color:rgba(255,255,255,0.85);transition:opacity 1.8s ease}
#brandName.visible{opacity:1}

#replay{position:fixed;bottom:3%;right:4%;z-index:25;opacity:0;pointer-events:none;
background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
color:rgba(255,255,255,.45);padding:8px 22px;border-radius:30px;
font-size:11px;letter-spacing:.25em;text-transform:uppercase;
cursor:pointer;transition:all .4s ease;font-family:inherit}
#replay.visible{opacity:1;pointer-events:auto}
#replay:hover{background:rgba(138,92,246,.15);border-color:rgba(138,92,246,.4);color:#fff}

#phaseLabel{position:fixed;top:4%;left:50%;transform:translateX(-50%);z-index:15;opacity:0;
font-size:9px;letter-spacing:.5em;text-transform:uppercase;
color:rgba(138,92,246,.35);transition:opacity .6s ease}
#phaseLabel.visible{opacity:1}
</style>
</head>
<body>
<canvas id="logoSrc" width="400" height="400"></canvas>
<canvas id="main"></canvas>
<div id="grain"></div>
<div id="vignette"></div>
<div id="phaseLabel"></div>
<div id="brandName">Aviance</div>
<div id="tagline">Intelligent Automation · Elevated</div>
<button id="replay">↻ Replay</button>

<script>
// ═══════════════════════════════════════════════════
//  AVIANCE — PIXEL-SAMPLED PARTICLE LOGO REVEAL
//  Traces exact logo shape from rendered SVG paths
// ═══════════════════════════════════════════════════

const main = document.getElementById('main');
const ctx = main.getContext('2d');
const srcCanvas = document.getElementById('logoSrc');
const srcCtx = srcCanvas.getContext('2d');

let W, H, cx, cy, sc;
let startTime, raf;
let logoParticles = [], ringParticles = [], ambientParts = [], sparks = [];

// ─── PALETTE ───
const PAL = {
  purple: [138, 92, 246],
  blue: [99, 130, 255],
  deepPurple: [88, 52, 196],
  white: [255, 255, 255],
  cyan: [140, 210, 255],
  lavender: [170, 140, 255],
};

// ─── TIMING (seconds) ───
const T = {
  drift: 1.8,
  converge: 3.8,
  snap: 2.0,
  ring: 1.8,
  bloom: 0.8,
  glitch: 0.5,
  hold: 5.0,
};
const TOTAL = Object.values(T).reduce((a, b) => a + b, 0);

// ─── DRAW LOGO ON HIDDEN CANVAS & SAMPLE PIXELS ───
function drawLogoOnSource() {
  const S = 400;
  const c = S / 2;
  srcCtx.clearRect(0, 0, S, S);

  // Draw the stylized "A" / alpha mark — white
  srcCtx.save();
  srcCtx.translate(c, c);
  srcCtx.strokeStyle = '#fff';
  srcCtx.fillStyle = '#fff';
  srcCtx.lineCap = 'round';
  srcCtx.lineJoin = 'round';

  // Main "A" shape — the Aviance alpha-style logo
  // Left upstroke
  srcCtx.lineWidth = 14;
  srcCtx.beginPath();
  srcCtx.moveTo(-52, 65);
  srcCtx.quadraticCurveTo(-30, -10, -8, -68);
  srcCtx.stroke();

  // Right downstroke
  srcCtx.beginPath();
  srcCtx.moveTo(-8, -68);
  srcCtx.quadraticCurveTo(15, -10, 52, 65);
  srcCtx.stroke();

  // The crossbar / alpha loop — left curve
  srcCtx.lineWidth = 12;
  srcCtx.beginPath();
  srcCtx.moveTo(-38, 18);
  srcCtx.bezierCurveTo(-42, -15, -25, -42, -5, -42);
  srcCtx.stroke();

  // Alpha loop — right curve going down
  srcCtx.beginPath();
  srcCtx.moveTo(-5, -42);
  srcCtx.bezierCurveTo(18, -42, 38, -18, 35, 10);
  srcCtx.stroke();

  // Alpha loop — bottom curve connecting back
  srcCtx.beginPath();
  srcCtx.moveTo(35, 10);
  srcCtx.bezierCurveTo(32, 32, 10, 38, -10, 32);
  srcCtx.stroke();

  srcCtx.beginPath();
  srcCtx.moveTo(-10, 32);
  srcCtx.bezierCurveTo(-28, 28, -38, 22, -38, 18);
  srcCtx.stroke();

  // Dot on the ring (top-right area)
  srcCtx.beginPath();
  srcCtx.arc(30, -78, 8, 0, Math.PI * 2);
  srcCtx.fill();

  srcCtx.restore();
}

function sampleLogoPixels(count) {
  const S = 400;
  const data = srcCtx.getImageData(0, 0, S, S).data;
  const whitePixels = [];

  // Collect all white-ish pixels
  for (let y = 0; y < S; y += 2) {
    for (let x = 0; x < S; x += 2) {
      const i = (y * S + x) * 4;
      if (data[i] > 180 && data[i + 1] > 180 && data[i + 2] > 180 && data[i + 3] > 100) {
        whitePixels.push({ x: x - S / 2, y: y - S / 2 });
      }
    }
  }

  // Randomly sample from the collected pixels
  const pts = [];
  for (let i = 0; i < count; i++) {
    if (whitePixels.length === 0) break;
    const idx = Math.floor(Math.random() * whitePixels.length);
    const p = whitePixels[idx];
    pts.push({
      x: p.x + (Math.random() - 0.5) * 3,
      y: p.y + (Math.random() - 0.5) * 3,
    });
  }
  return pts;
}

function getRingPoints(count) {
  const pts = [];
  const radius = 140;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.015;
    pts.push({ x: Math.cos(a) * radius, y: Math.sin(a) * radius, angle: a });
  }
  return pts;
}

// ─── EASING ───
const ease = {
  outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  outBack: t => { const c = 1.7; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); },
  inOutCubic: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2,
  outQuart: t => 1 - Math.pow(1-t, 4),
};

// ─── PARTICLE ───
class Particle {
  constructor(tx, ty, type) {
    this.type = type;
    this.tx = tx; this.ty = ty;

    const a = Math.random() * Math.PI * 2;
    const d = (350 + Math.random() * 500) * sc;
    this.x = cx + Math.cos(a) * d;
    this.y = cy + Math.sin(a) * d;
    this.vx = (Math.random() - 0.5) * 1.8;
    this.vy = (Math.random() - 0.5) * 1.8;

    this.size = type === 'logo'
      ? (1.2 + Math.random() * 2.0) * sc
      : (0.7 + Math.random() * 1.3) * sc;

    // Pick color
    const r = Math.random();
    if (type === 'logo') {
      this.color = r < 0.35 ? PAL.white : r < 0.55 ? PAL.lavender : r < 0.75 ? PAL.purple : r < 0.9 ? PAL.blue : PAL.cyan;
    } else {
      this.color = r < 0.4 ? PAL.purple : r < 0.7 ? PAL.blue : r < 0.85 ? PAL.deepPurple : PAL.cyan;
    }

    this.alpha = 0;
    this.maxAlpha = 0.45 + Math.random() * 0.55;
    this.delay = Math.random() * 0.7;
    this.pulseOff = Math.random() * 6.28;
    this.pulseSpd = 0.6 + Math.random() * 1.4;
  }

  getTarget() {
    return { x: this.tx * sc + cx, y: this.ty * sc + cy };
  }

  update(elapsed, dt) {
    const tgt = this.getTarget();
    const { drift, converge, snap } = T;
    const t1 = drift, t2 = t1 + converge, t3 = t2 + snap;

    if (elapsed < t1 + this.delay) {
      // Drift phase
      this.x += this.vx * dt * 50;
      this.y += this.vy * dt * 50;
      this.vx += (Math.random() - 0.5) * 0.08;
      this.vy += (Math.random() - 0.5) * 0.08;
      this.vx *= 0.985; this.vy *= 0.985;
      this.alpha = Math.min(this.alpha + dt * 1.5, this.maxAlpha * 0.25);
    } else if (elapsed < t2) {
      // Converge
      const p = ease.outExpo(Math.min(1, (elapsed - t1 - this.delay) / Math.max(0.1, converge - this.delay)));
      this.x += (tgt.x - this.x) * p * 0.06;
      this.y += (tgt.y - this.y) * p * 0.06;
      this.vx *= 0.9; this.vy *= 0.9;
      this.alpha = Math.min(this.alpha + dt * 2.5, this.maxAlpha * 0.55);
    } else if (elapsed < t3) {
      // Snap into place
      const p = ease.outBack(Math.min(1, (elapsed - t2) / snap));
      this.x += (tgt.x - this.x) * 0.14;
      this.y += (tgt.y - this.y) * 0.14;
      this.alpha = this.maxAlpha * (0.55 + 0.45 * p);
    } else {
      // Settled — breathe
      this.x += (tgt.x - this.x) * 0.18;
      this.y += (tgt.y - this.y) * 0.18;
      const breath = Math.sin(elapsed * this.pulseSpd + this.pulseOff) * 0.12;
      this.alpha = this.maxAlpha * (0.88 + breath);
    }
  }

  draw(ctx, gx) {
    if (this.alpha < 0.01) return;
    const ox = gx ? (Math.random() > 0.5 ? gx : -gx) : 0;

    // Core
    ctx.beginPath();
    ctx.arc(this.x + ox, this.y, this.size, 0, 6.28);
    ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${this.alpha})`;
    ctx.fill();

    // Soft glow halo
    if (this.alpha > 0.35) {
      ctx.beginPath();
      ctx.arc(this.x + ox, this.y, this.size * 3.5, 0, 6.28);
      ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${this.alpha * 0.06})`;
      ctx.fill();
    }
  }
}

// ─── AMBIENT ───
class Ambient {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.35;
    this.vy = (Math.random() - 0.5) * 0.35;
    this.size = (0.4 + Math.random() * 1.2) * sc;
    this.alpha = 0.04 + Math.random() * 0.12;
    const r = Math.random();
    this.color = r < 0.4 ? PAL.purple : r < 0.7 ? PAL.blue : PAL.cyan;
  }
  update(dt) {
    this.x += this.vx * dt * 55;
    this.y += this.vy * dt * 55;
    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) this.reset();
  }
  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, 6.28);
    ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${this.alpha})`;
    ctx.fill();
  }
}

// ─── SPARK ───
class Spark {
  constructor() { this.active = false; }
  emit(x, y) {
    this.x = x; this.y = y;
    const a = Math.random() * 6.28;
    const spd = (2 + Math.random() * 5) * sc;
    this.vx = Math.cos(a) * spd;
    this.vy = Math.sin(a) * spd;
    this.life = this.maxLife = 0.4 + Math.random() * 0.7;
    this.size = (0.4 + Math.random() * 1.2) * sc;
    this.color = Math.random() > 0.5 ? PAL.purple : PAL.cyan;
    this.active = true;
  }
  update(dt) {
    if (!this.active) return;
    this.x += this.vx * dt * 55;
    this.y += this.vy * dt * 55;
    this.vx *= 0.95; this.vy *= 0.95;
    this.life -= dt;
    if (this.life <= 0) this.active = false;
  }
  draw(ctx) {
    if (!this.active) return;
    const a = this.life / this.maxLife;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * a, 0, 6.28);
    ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${a * 0.65})`;
    ctx.fill();
  }
}

// ─── RESIZE ───
function resize() {
  W = main.width = innerWidth;
  H = main.height = innerHeight;
  cx = W / 2;
  cy = H / 2;
  sc = Math.min(W, H) / 700;
}

// ─── INIT ───
function init() {
  resize();
  logoParticles = [];
  ringParticles = [];
  ambientParts = [];
  sparks = [];

  document.getElementById('tagline').classList.remove('visible');
  document.getElementById('brandName').classList.remove('visible');
  document.getElementById('replay').classList.remove('visible');
  document.getElementById('phaseLabel').classList.remove('visible');

  // Render logo on hidden canvas & sample
  drawLogoOnSource();
  const logoPts = sampleLogoPixels(3200);
  for (const p of logoPts) {
    logoParticles.push(new Particle(p.x, p.y, 'logo'));
  }

  // Ring
  const ringPts = getRingPoints(700);
  for (const p of ringPts) {
    const rp = new Particle(p.x, p.y, 'ring');
    rp.delay += 0.6;
    ringParticles.push(rp);
  }

  // Ambient
  for (let i = 0; i < 140; i++) ambientParts.push(new Ambient());

  // Sparks pool
  for (let i = 0; i < 80; i++) sparks.push(new Spark());

  startTime = performance.now();
  glitchT = 0;
  sparkT = 0;
  lastT = 0;
  if (raf) cancelAnimationFrame(raf);
  loop();
}

// ─── MAIN LOOP ───
let lastT = 0, sparkT = 0, glitchT = 0;

function loop() {
  const now = performance.now();
  const dt = Math.min((now - (lastT || now)) / 1000, 0.05);
  lastT = now;
  const el = (now - startTime) / 1000;

  // Phase boundaries
  const { drift, converge, snap, ring, bloom, glitch, hold } = T;
  const t1 = drift, t2 = t1+converge, t3 = t2+snap, t4 = t3+ring, t5 = t4+bloom, t6 = t5+glitch;

  let phase = 'drift';
  if (el > t6) phase = 'hold';
  else if (el > t5) phase = 'glitch';
  else if (el > t4) phase = 'bloom';
  else if (el > t3) phase = 'ring';
  else if (el > t2) phase = 'snap';
  else if (el > t1) phase = 'converge';

  // Phase label
  const phL = document.getElementById('phaseLabel');
  const labels = { drift:'Initializing',converge:'Assembling',snap:'Forming',ring:'Activating',bloom:'Powering Up',glitch:'Online',hold:'Aviance' };
  phL.textContent = labels[phase] || '';
  phL.classList.add('visible');

  // Glitch
  let gx = 0;
  if (phase === 'glitch') {
    glitchT += dt;
    if (glitchT < glitch) {
      gx = Math.random() < 0.35 ? Math.sin(glitchT * 45) * 7 * sc : 0;
    }
  }

  // Clear with trail
  ctx.fillStyle = el < 0.1 ? '#000' : 'rgba(0,0,0,0.14)';
  ctx.fillRect(0, 0, W, H);

  // Ambient
  for (const a of ambientParts) { a.update(dt); a.draw(ctx); }

  // Logo particles
  for (const p of logoParticles) { p.update(el, dt); p.draw(ctx, gx); }

  // Ring particles (delayed)
  if (el > t1 + converge * 0.65) {
    for (const r of ringParticles) { r.update(el - 0.6, dt); r.draw(ctx, gx * 0.4); }
  }

  // Gradient ring stroke when assembled
  if (el > t3) {
    const ra = Math.min(1, (el - t3) / ring) * 0.35;
    const radius = 140 * sc;
    ctx.save();
    ctx.translate(cx, cy);

    // Purple ring
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, 6.28);
    ctx.strokeStyle = `rgba(138,92,246,${ra})`;
    ctx.lineWidth = 2.5 * sc;
    ctx.shadowColor = 'rgba(138,92,246,0.5)';
    ctx.shadowBlur = 22 * sc;
    ctx.stroke();

    // Blue secondary ring
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, 6.28);
    ctx.strokeStyle = `rgba(99,130,255,${ra * 0.45})`;
    ctx.lineWidth = 1.5 * sc;
    ctx.shadowColor = 'rgba(99,130,255,0.35)';
    ctx.shadowBlur = 28 * sc;
    ctx.stroke();

    // Gradient arc overlay (purple → blue gradient feel)
    const grad = ctx.createLinearGradient(-radius, -radius, radius, radius);
    grad.addColorStop(0, `rgba(138,92,246,${ra * 0.4})`);
    grad.addColorStop(1, `rgba(99,130,255,${ra * 0.4})`);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, 6.28);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3 * sc;
    ctx.shadowBlur = 0;
    ctx.stroke();

    ctx.restore();
  }

  // Sparks during snap & ring phases
  if (phase === 'snap' || phase === 'ring') {
    sparkT += dt;
    if (sparkT > 0.035) {
      sparkT = 0;
      const s = sparks.find(s => !s.active);
      if (s) {
        const src = logoParticles[Math.floor(Math.random() * logoParticles.length)];
        s.emit(src.x, src.y);
      }
    }
  }
  for (const s of sparks) { s.update(dt); s.draw(ctx); }

  // Center bloom
  if (el > t2) {
    const bp = Math.min(1, (el - t2) / (snap + ring));
    const ba = bp * 0.1;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 220 * sc);
    g.addColorStop(0, `rgba(138,92,246,${ba})`);
    g.addColorStop(0.4, `rgba(99,130,255,${ba * 0.35})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // Glitch flash effect
  if (phase === 'glitch' && glitchT < 0.12) {
    ctx.fillStyle = `rgba(138,92,246,${0.06 * (1 - glitchT / 0.12)})`;
    ctx.fillRect(0, 0, W, H);
    // Scan lines
    for (let i = 0; i < H; i += 3) {
      if (Math.random() < 0.25) {
        ctx.fillStyle = `rgba(0,0,0,${0.08 * Math.random()})`;
        ctx.fillRect(0, i, W, 1.5);
      }
    }
    // Chromatic aberration strips
    if (Math.random() < 0.4) {
      const sy = Math.random() * H;
      const sh = 2 + Math.random() * 8;
      ctx.fillStyle = `rgba(138,92,246,0.04)`;
      ctx.fillRect(0, sy, W, sh);
    }
  }

  // Show brand name
  if (el > t4 + bloom * 0.3) {
    document.getElementById('brandName').classList.add('visible');
  }

  // Show tagline
  if (el > t5) {
    document.getElementById('tagline').classList.add('visible');
  }

  // Replay button
  if (el > TOTAL - hold + 2.5) {
    document.getElementById('replay').classList.add('visible');
    phL.textContent = 'Aviance';
  }

  // Slow ring rotation when settled
  if (el > t3 + ring) {
    for (const r of ringParticles) {
      const tgt = r.getTarget();
      const dx = tgt.x - cx, dy = tgt.y - cy;
      const ang = Math.atan2(dy, dx) + 0.0004;
      const dist = Math.sqrt(dx * dx + dy * dy) / sc;
      r.tx = Math.cos(ang) * dist;
      r.ty = Math.sin(ang) * dist;
    }
  }

  raf = requestAnimationFrame(loop);
}

// ─── EVENTS ───
window.addEventListener('resize', () => { resize(); });
document.getElementById('replay').addEventListener('click', () => { init(); });

// ─── START ───
init();
</script>
</body>
</html>
