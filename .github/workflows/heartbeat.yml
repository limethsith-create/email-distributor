name: heartbeat-backup

# Backup heartbeat (SPEC §2 "Heartbeat B"). cron-job.org is the primary
# pinger (every minute); this one keeps the machine ticking if it stops.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# This repo is public: the job needs no GitHub token, and prints only the status code.
permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://email-distributor.vercel.app' }}
        run: |
          code=$(curl -sS -m 40 -o /tmp/tick.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick?source=github")
          echo "tick answered HTTP $code"
          test "$code" = "200"
