name: Recording Cron

# Sending is handled by an external tool — this workflow NEVER sends email.
# It only records inbound activity: replies and bounces, so the leads list
# stays up to date. Runs every 2 hours.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check replies (records replies onto leads)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Checking replies..."
          curl -sf "https://email-distributor.vercel.app/api/cron/check-replies?token=${CRON_SECRET}" || true
          echo ""

      - name: Check bounces (every 4 hours)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HOUR=$(date -u +%-H)
          if [ $((HOUR % 4)) -eq 0 ]; then
            echo "Checking bounces..."
            curl -sf "https://email-distributor.vercel.app/api/cron/check-bounces?token=${CRON_SECRET}" || true
          else
            echo "Skipping bounce check (runs every 4 hours)"
          fi
