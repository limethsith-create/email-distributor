name: keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# A weekly timestamp commit keeps the backup heartbeat and backups alive
# (SPEC §10.3). vercel.json skips the build for .keepalive-only commits.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "aviance-keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive && git commit -qm "keepalive [skip ci]" && git push -q
