<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Motion Graphics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
  }

  canvas#particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .scene {
    position: relative;
    z-index: 2;
    width: 500px;
    height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Outer glow pulse */
  .outer-glow {
    position: absolute;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120,80,255,0.15) 0%, transparent 70%);
    opacity: 0;
    animation: outerGlowIn 1.5s ease-out 1.8s forwards, outerPulse 3s ease-in-out 3.3s infinite;
  }

  @keyframes outerGlowIn {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes outerPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.7; }
  }

  /* Ring */
  .ring-container {
    position: absolute;
    width: 340px; height: 340px;
  }

  .ring {
    width: 100%; height: 100%;
    border-radius: 50%;
    position: relative;
    opacity: 0;
    animation: ringReveal 1.2s ease-out 1s forwards;
  }

  .ring svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }

  .ring svg circle.ring-bg {
    fill: none;
    stroke: rgba(100,70,200,0.08);
    stroke-width: 5;
  }

  .ring svg circle.ring-gradient {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 1005;
    stroke-dashoffset: 1005;
    animation: ringDraw 2s ease-in-out 1.2s forwards;
    filter: drop-shadow(0 0 8px rgba(120,80,255,0.6)) drop-shadow(0 0 20px rgba(80,120,255,0.3));
  }

  @keyframes ringReveal {
    from { opacity: 0; transform: scale(0.6) rotate(180deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes ringDraw {
    to { stroke-dashoffset: 0; }
  }

  /* Orbiting orb */
  .orb-track {
    position: absolute;
    width: 340px; height: 340px;
    border-radius: 50%;
    opacity: 0;
    animation: orbAppear 0.5s ease-out 2.8s forwards, orbSpin 6s linear 2.8s infinite;
  }

  .orb {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #4466cc, #1a1a4a);
    box-shadow: 0 0 15px rgba(80,100,220,0.6), 0 0 40px rgba(80,100,220,0.3), inset 0 0 8px rgba(100,130,255,0.3);
  }

  .orb::after {
    content: '';
    position: absolute;
    top: 4px; left: 5px;
    width: 8px; height: 6px;
    background: radial-gradient(ellipse, rgba(180,200,255,0.7), transparent);
    border-radius: 50%;
  }

  @keyframes orbAppear { from { opacity: 0; } to { opacity: 1; } }
  @keyframes orbSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Logo alpha symbol */
  .logo-alpha {
    position: absolute;
    opacity: 0;
    animation: logoSlam 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
    z-index: 5;
  }

  .logo-alpha svg {
    width: 160px; height: 160px;
  }

  @keyframes logoSlam {
    0% { opacity: 0; transform: scale(3) rotate(-15deg); filter: drop-shadow(0 0 60px rgba(255,255,255,1)) brightness(3); }
    50% { opacity: 1; transform: scale(0.9) rotate(2deg); filter: drop-shadow(0 0 30px rgba(255,255,255,0.8)) brightness(1.5); }
    70% { transform: scale(1.05) rotate(-1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)) brightness(1); }
  }

  /* Flash on logo slam */
  .flash {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(120,80,255,0.3) 40%, transparent 70%);
    opacity: 0;
    z-index: 100;
    pointer-events: none;
    animation: flashBang 0.6s ease-out 0.3s forwards;
  }

  @keyframes flashBang {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  /* Shockwave ring */
  .shockwave {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 3px solid rgba(120,80,255,0.8);
    opacity: 0;
    z-index: 4;
    animation: shockwaveExpand 1s ease-out 0.35s forwards;
  }

  .shockwave2 {
    animation-delay: 0.5s;
    border-color: rgba(80,120,255,0.6);
  }

  @keyframes shockwaveExpand {
    0% { width: 50px; height: 50px; opacity: 0.8; border-width: 3px; }
    100% { width: 600px; height: 600px; opacity: 0; border-width: 1px; }
  }

  /* Energy lines */
  .energy-lines {
    position: absolute;
    width: 400px; height: 400px;
    opacity: 0;
    animation: energyIn 1s ease-out 1.6s forwards;
  }

  .energy-line {
    position: absolute;
    top: 50%; left: 50%;
    width: 2px;
    height: 0;
    background: linear-gradient(to top, transparent, rgba(120,80,255,0.6), transparent);
    transform-origin: bottom center;
    animation: lineShoot 0.8s ease-out forwards;
    opacity: 0;
  }

  @keyframes energyIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lineShoot {
    0% { height: 0; opacity: 0; }
    30% { opacity: 0.8; }
    100% { height: 180px; opacity: 0; }
  }

  /* Floating ambient particles around logo */
  .ambient-particle {
    position: absolute;
    width: 3px; height: 3px;
    background: rgba(140,120,255,0.6);
    border-radius: 50%;
    opacity: 0;
    animation: ambientFloat 4s ease-in-out infinite;
  }

  @keyframes ambientFloat {
    0%, 100% { opacity: 0; transform: translateY(0) scale(0); }
    20% { opacity: 0.8; transform: translateY(-10px) scale(1); }
    80% { opacity: 0.5; transform: translateY(-50px) scale(0.5); }
  }

  /* Scan line effect */
  .scanline {
    position: absolute;
    width: 350px; height: 2px;
    background: linear-gradient(to right, transparent, rgba(120,80,255,0.5), rgba(255,255,255,0.8), rgba(120,80,255,0.5), transparent);
    opacity: 0;
    z-index: 6;
    animation: scanDown 1.5s ease-in-out 3.5s forwards, scanDown 4s ease-in-out 6s infinite;
  }

  @keyframes scanDown {
    0% { top: 30%; opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { top: 70%; opacity: 0; }
  }

  /* Glitch effect on logo */
  .glitch-layer {
    position: absolute;
    opacity: 0;
    mix-blend-mode: screen;
    animation: glitch 0.15s steps(2) 3.2s 3;
    z-index: 5;
  }
  .glitch-layer.red { filter: hue-rotate(-30deg); }
  .glitch-layer.blue { filter: hue-rotate(30deg); }

  @keyframes glitch {
    0% { opacity: 0.5; transform: translate(-3px, 1px); }
    50% { opacity: 0.3; transform: translate(3px, -1px); }
    100% { opacity: 0; transform: translate(0); }
  }

  /* Bottom text */
  .brand-text {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    opacity: 0;
    animation: textReveal 1.2s ease-out 3.5s forwards;
  }

  .brand-text .line {
    height: 1px;
    width: 0;
    background: linear-gradient(to right, transparent, rgba(120,80,255,0.6), transparent);
    margin: 0 auto 15px;
    animation: lineExpand 1s ease-out 3.8s forwards;
  }

  .brand-text h2 {
    font-size: 14px;
    letter-spacing: 12px;
    text-transform: uppercase;
    color: rgba(200,190,255,0.7);
    font-weight: 300;
  }

  @keyframes textReveal {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes lineExpand {
    from { width: 0; }
    to { width: 200px; }
  }

  /* Vignette */
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* Film grain overlay */
  .grain {
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    z-index: 200;
    pointer-events: none;
    opacity: 0.04;
    animation: grainShift 0.5s steps(4) infinite;
  }

  @keyframes grainShift {
    0% { transform: translate(0,0); }
    25% { transform: translate(-2%,3%); }
    50% { transform: translate(3%,-1%); }
    75% { transform: translate(-3%,-2%); }
    100% { transform: translate(1%,2%); }
  }

  /* Replay button */
  .replay-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 300;
    background: rgba(120,80,255,0.15);
    border: 1px solid rgba(120,80,255,0.3);
    color: rgba(200,190,255,0.8);
    padding: 10px 24px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.3s;
    opacity: 0;
    animation: fadeIn 0.5s ease-out 5s forwards;
    backdrop-filter: blur(10px);
  }
  .replay-btn:hover {
    background: rgba(120,80,255,0.3);
    border-color: rgba(120,80,255,0.6);
    color: #fff;
    box-shadow: 0 0 20px rgba(120,80,255,0.3);
  }

  @keyframes fadeIn { to { opacity: 1; } }

  /* Chromatic aberration on whole scene (subtle) */
  .scene { animation: subtleFloat 6s ease-in-out 4s infinite; }
  @keyframes subtleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
</style>
</head>
<body>

<div class="vignette"></div>
<canvas id="grainCanvas" class="grain"></canvas>

<canvas id="particles"></canvas>

<div class="flash"></div>

<div class="scene">
  <!-- Outer glow -->
  <div class="outer-glow"></div>

  <!-- Shockwaves -->
  <div class="shockwave"></div>
  <div class="shockwave shockwave2"></div>

  <!-- Energy lines (generated by JS) -->
  <div class="energy-lines" id="energyLines"></div>

  <!-- Gradient ring -->
  <div class="ring-container">
    <div class="ring">
      <svg viewBox="0 0 340 340">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7B5EE0"/>
            <stop offset="30%" stop-color="#6B6EF0"/>
            <stop offset="60%" stop-color="#5B8EFF"/>
            <stop offset="100%" stop-color="#8B5ED0"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="170" cy="170" r="160"/>
        <circle class="ring-gradient" cx="170" cy="170" r="160"/>
      </svg>
    </div>
  </div>

  <!-- Orbiting orb -->
  <div class="orb-track">
    <div class="orb"></div>
  </div>

  <!-- Logo -->
  <div class="logo-alpha">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Alpha symbol path -->
      <path d="M100 30 C60 30, 30 65, 35 105 C38 130, 55 150, 75 160 L55 185 C52 189, 54 193, 58 193 L78 193 C82 193, 85 191, 87 188 L103 165 C105 165, 107 165, 109 164 L125 188 C127 191, 130 193, 134 193 L154 193 C158 193, 160 189, 157 185 L135 158 C155 148, 170 128, 172 105 C176 65, 146 30, 106 30 Z M80 120 C75 100, 80 75, 100 65 C120 55, 140 70, 142 95 C143 108, 137 120, 126 130 L105 96 C103 93, 99 93, 97 96 L80 120 Z" fill="white"/>
    </svg>
  </div>

  <!-- Glitch copies -->
  <div class="logo-alpha glitch-layer red">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 30 C60 30, 30 65, 35 105 C38 130, 55 150, 75 160 L55 185 C52 189, 54 193, 58 193 L78 193 C82 193, 85 191, 87 188 L103 165 C105 165, 107 165, 109 164 L125 188 C127 191, 130 193, 134 193 L154 193 C158 193, 160 189, 157 185 L135 158 C155 148, 170 128, 172 105 C176 65, 146 30, 106 30 Z M80 120 C75 100, 80 75, 100 65 C120 55, 140 70, 142 95 C143 108, 137 120, 126 130 L105 96 C103 93, 99 93, 97 96 L80 120 Z" fill="white"/>
    </svg>
  </div>
  <div class="logo-alpha glitch-layer blue">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 30 C60 30, 30 65, 35 105 C38 130, 55 150, 75 160 L55 185 C52 189, 54 193, 58 193 L78 193 C82 193, 85 191, 87 188 L103 165 C105 165, 107 165, 109 164 L125 188 C127 191, 130 193, 134 193 L154 193 C158 193, 160 189, 157 185 L135 158 C155 148, 170 128, 172 105 C176 65, 146 30, 106 30 Z M80 120 C75 100, 80 75, 100 65 C120 55, 140 70, 142 95 C143 108, 137 120, 126 130 L105 96 C103 93, 99 93, 97 96 L80 120 Z" fill="white"/>
    </svg>
  </div>

  <!-- Scan line -->
  <div class="scanline"></div>

  <!-- Ambient particles (generated by JS) -->
  <div id="ambientParticles"></div>
</div>

<!-- Brand text -->
<div class="brand-text">
  <div class="line"></div>
  <h2>Powered by Innovation</h2>
</div>

<button class="replay-btn" onclick="location.reload()">Replay</button>

<script>
// ============ PARTICLE SYSTEM ============
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 'burst', 'ambient', 'trail'
    if (type === 'burst') {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 8;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.decay = 0.008 + Math.random() * 0.015;
      this.size = 1 + Math.random() * 3;
      this.color = Math.random() > 0.5 ? [120,80,255] : [80,120,255];
    } else if (type === 'ambient') {
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = -0.3 - Math.random() * 0.5;
      this.life = 1;
      this.decay = 0.003 + Math.random() * 0.005;
      this.size = 0.5 + Math.random() * 2;
      this.color = [140, 120, 255];
    } else if (type === 'trail') {
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 2;
      this.life = 1;
      this.decay = 0.02 + Math.random() * 0.02;
      this.size = 1 + Math.random() * 2;
      this.color = [200, 180, 255];
    } else if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = 5 + Math.random() * 15;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.decay = 0.03 + Math.random() * 0.03;
      this.size = 0.5 + Math.random() * 1.5;
      this.color = [255, 255, 255];
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.type === 'burst') {
      this.vx *= 0.98;
      this.vy *= 0.98;
    }
    if (this.type === 'spark') {
      this.vx *= 0.95;
      this.vy *= 0.95;
    }
    return this.life > 0;
  }

  draw() {
    const a = this.life;
    const [r, g, b] = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * a, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${a * 0.8})`;
    ctx.fill();

    // Glow
    if (this.size > 1) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * a * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${a * 0.1})`;
      ctx.fill();
    }
  }
}

let particles = [];
const cx = W / 2, cy = H / 2;

// Initial burst at 0.3s (logo slam)
setTimeout(() => {
  for (let i = 0; i < 150; i++) {
    particles.push(new Particle(W/2, H/2, 'burst'));
  }
  for (let i = 0; i < 80; i++) {
    particles.push(new Particle(W/2, H/2, 'spark'));
  }
}, 300);

// Secondary burst at ring draw
setTimeout(() => {
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 160;
    particles.push(new Particle(W/2 + Math.cos(angle)*r, H/2 + Math.sin(angle)*r, 'burst'));
  }
}, 1200);

// Continuous ambient particles
let ambientTimer;
setTimeout(() => {
  ambientTimer = setInterval(() => {
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 150;
    particles.push(new Particle(
      W/2 + Math.cos(angle) * dist,
      H/2 + Math.sin(angle) * dist,
      'ambient'
    ));
  }, 80);
}, 2000);

// Orb trail particles
let orbTime = 0;
let orbTrailActive = false;
setTimeout(() => { orbTrailActive = true; }, 2800);

function animate() {
  ctx.clearRect(0, 0, W, H);

  // Orb trail
  if (orbTrailActive) {
    orbTime += 0.017;
    const orbAngle = (orbTime * (Math.PI * 2 / 6)) - Math.PI/2; // matches CSS 6s rotation
    const orbR = 170;
    const ox = W/2 + Math.cos(orbAngle) * orbR;
    const oy = H/2 + Math.sin(orbAngle) * orbR;
    if (Math.random() > 0.3) {
      particles.push(new Particle(ox, oy, 'trail'));
    }
  }

  particles = particles.filter(p => {
    if (p.update()) {
      p.draw();
      return true;
    }
    return false;
  });

  requestAnimationFrame(animate);
}
animate();

// ============ ENERGY LINES ============
const energyContainer = document.getElementById('energyLines');
for (let i = 0; i < 24; i++) {
  const line = document.createElement('div');
  line.className = 'energy-line';
  line.style.transform = `rotate(${i * 15}deg)`;
  line.style.animationDelay = `${1.6 + Math.random() * 0.5}s`;
  energyContainer.appendChild(line);
}

// ============ AMBIENT FLOATING PARTICLES (DOM) ============
const ambientContainer = document.getElementById('ambientParticles');
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'ambient-particle';
  p.style.left = (Math.random() * 400 - 200 + 250) + 'px';
  p.style.top = (Math.random() * 400 - 200 + 250) + 'px';
  p.style.animationDelay = `${Math.random() * 4}s`;
  p.style.animationDuration = `${3 + Math.random() * 3}s`;
  p.style.width = p.style.height = `${2 + Math.random() * 3}px`;
  ambientContainer.appendChild(p);
}

// ============ FILM GRAIN ============
const grainCanvas = document.getElementById('grainCanvas');
const gCtx = grainCanvas.getContext('2d');
grainCanvas.width = 256;
grainCanvas.height = 256;

function drawGrain() {
  const imageData = gCtx.createImageData(256, 256);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random() * 255;
    data[i] = data[i+1] = data[i+2] = v;
    data[i+3] = 255;
  }
  gCtx.putImageData(imageData, 0, 0);
  requestAnimationFrame(drawGrain);
}
drawGrain();
</script>

</body>
</html>
